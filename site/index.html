<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>No Walls</title>
  <style>
    :root { --bg: #fafafa; --fg: #1a1a1a; --muted: #666; --accent: #e64415; --field: #fff; --line: #ccc; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #eee; --muted: #aaa; --field: #222; --line: #444; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 system-ui, sans-serif; }
    main { max-width: 32rem; margin: 0 auto; padding: 48px 16px; }
    input, button { box-sizing: border-box; width: 100%; padding: 14px; border-radius: 12px; font: inherit; }
    input { margin: 24px 0 12px; border: 1px solid var(--line); background: var(--field); color: var(--fg); }
    button { border: 0; background: var(--accent); color: #fff; font-weight: 600; }
    #err { color: var(--accent); min-height: 1.5em; }
  </style>
</head>
<body>
<main>
  <h1>No Walls</h1>
  <form id="f">
    <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" required autofocus>
    <button>Weiter</button>
    <p id="err"></p>
  </form>
</main>
<script>
  // The install page lives in a folder named after the password's SHA-256 hash.
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = document.getElementById("pw").value;
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw));
    const hash = [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
    const res = await fetch(hash + "/", { method: "HEAD" });
    if (res.ok) location.href = hash + "/";
    else document.getElementById("err").textContent = "Falsches Passwort.";
  });
</script>
</body>
</html>
