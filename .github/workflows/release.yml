# Push a tag like v0.2.0 to sign the extension (unlisted on AMO) and publish it
# behind the password gate on GitHub Pages. The install page, .xpi and
# updates.json live in a folder named sha256(SITE_PASSWORD), so nothing
# downloadable is reachable without the password.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare manifest
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          test -n "$SITE_PASSWORD" || { echo "SITE_PASSWORD secret is missing"; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          HASH=$(printf '%s' "$SITE_PASSWORD" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$HASH"
          BASE="https://d-rk.github.io/no-walls/$HASH"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "HASH=$HASH" >> "$GITHUB_ENV"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          jq --arg v "$VERSION" --arg u "$BASE/updates.json" \
            '.version = $v | .browser_specific_settings.gecko.update_url = $u' \
            manifest.json > m.json && mv m.json manifest.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sign with Mozilla (unlisted)
        run: |
          npx -y web-ext@8 sign \
            --channel=unlisted \
            --source-dir=. \
            --ignore-files="site/**" ".github/**" "README.md" \
            --artifacts-dir=dist \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}"
          mv dist/*.xpi "dist/no-walls-$VERSION.xpi"

      - name: Build Pages site
        run: |
          mkdir -p "public/$HASH"
          cp site/index.html site/robots.txt public/
          cp site/install.html "public/$HASH/index.html"
          cp "dist/no-walls-$VERSION.xpi" "public/$HASH/"
          cp "dist/no-walls-$VERSION.xpi" "public/$HASH/no-walls.xpi"
          jq -n --arg v "$VERSION" --arg l "$BASE/no-walls-$VERSION.xpi" \
            '{addons: {"no-walls@dirkwilden": {updates: [{version: $v, update_link: $l}]}}}' \
            > "public/$HASH/updates.json"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
